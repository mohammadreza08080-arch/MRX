<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0E">
<title>Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/chatbot.css">
</head>
  <body>
    <header>
      <div class="brand">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg>
        </div>
        <span></span>
      </div>
      <nav>
        <a href="../index.html">Product</a><a href="#">Docs</a><a href="#">Support</a>
      </nav>
    </header>
    <div class="overlay" id="overlay"></div>
      <div class="layout">
        <main>
          <div id="messages">
            <div class="inner" id="chat">
              <div class="hero">
                <h1>How can I help today?</h1>
                <p>Ask a question or pick a suggestion below.</p>
              </div>
              <div class="chips" id="chips">
                <button class="chip">My Credentials</button>
                <button class="chip">talk to me</button>
                <button class="chip">what areas of expertise do you have</button>
              </div>
            </div>
          </div>
        <div class="composer">
          <div class="inner">
            <form id="form">
              <label class="sr-only" for="msg">Message</label>
              <input id="msg" type="text" placeholder="Type your message" autocomplete="off">
              <button class="send" type="submit" aria-label="Send message">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
              </button>
            </form>
            <div class="note">This bot can only answer questions related to me.</div>
          </div>
        </div>
      </main>
    </div>
    <script src="../js/chatbot.js"></script>
  </body>
</html>
